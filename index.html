<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
  <meta name="apple-mobile-web-app-capable" content="yes">
 <link rel="apple-touch-icon" href="https://i.postimg.cc/T1mkrYZ4/84.jpg">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#d5d6d6">
<title>保护海粼</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<style>
:root{
  --blue:#007aff;--green:#34c759;--red:#ff3b30;--gray:#8e8e93;
  --line:#e5e5ea;--bg:#f2f2f7;--ink:#111;--white:#fff;
  --radius:22px;--radius-sm:15px;--shadow:0 6px 18px rgba(38,52,60,.08);
  --kkt-yellow:#fee500;--kkt-brown:#3c1e1e;--kkt-bg:#bacee0;--kkt-chat-bubble:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;min-height:100dvh;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,"PingFang SC","Apple SD Gothic Neo",sans-serif;color:var(--ink);overflow:hidden;background:#0d0d0f}
body{display:flex;justify-content:center;align-items:center}

.stage{width:100vw;max-width:480px;height:100dvh;position:relative;background:#000;overflow:hidden}
.phone{position:absolute;inset:0;border:0;border-radius:0;overflow:hidden;background:#d4d5d5;isolation:isolate}
.wallpaper{position:absolute;inset:0;background:
  radial-gradient(ellipse at 78% 18%,#d9e0e2 0,transparent 31%),
  radial-gradient(ellipse at 18% 68%,#f0e9e2 0,transparent 38%),
  linear-gradient(145deg,#b9c4c7 0%,#e5e0da 48%,#aebdc2 100%)}
.wallpaper:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#ffffff20,transparent 55%,#28363c18)}

.status{position:absolute;z-index:120;top:calc(env(safe-area-inset-top, 0px) + 10px);left:8%;right:8%;height:22px;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;letter-spacing:-.3px;color:#253536;pointer-events:none}
.status.white{color:#fff}
.status.dark{color:#191919}
.status-right{display:flex;gap:6px;align-items:center}
.signal{height:13px;display:flex;gap:2px;align-items:flex-end}
.signal i{display:block;width:3px;background:currentColor;border-radius:2px}
.signal i:nth-child(1){height:4px}.signal i:nth-child(2){height:6px}.signal i:nth-child(3){height:9px}.signal i:nth-child(4){height:12px}
.wifi{width:15px;height:12px;position:relative;overflow:hidden}
.wifi:before{content:"";position:absolute;width:14px;height:14px;border:2px solid currentColor;border-color:currentColor transparent transparent;border-radius:50%;top:2px;left:0}
.wifi:after{content:"";position:absolute;width:6px;height:6px;border:2px solid currentColor;border-color:currentColor transparent transparent;border-radius:50%;top:7px;left:4px}
.battery{height:12px;min-width:25px;border-radius:3px;background:currentColor;position:relative;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#d6d6d6}
.battery:after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;border-radius:0 2px 2px 0;background:currentColor}
.battery span{color:#d5d5d5;background:#253536;border-radius:2px;display:block;width:100%;height:100%;text-align:center;line-height:12px}
.white .battery span{background:#fff;color:#444}
.dark .battery span{background:#111;color:#fff}

.island{position:absolute;z-index:125;top:calc(env(safe-area-inset-top, 0px) + 4px);left:50%;transform:translateX(-50%);width:116px;height:31px;border-radius:20px;background:#000;pointer-events:none}

.screen{position:absolute;inset:0;z-index:2;transition:opacity .22s,transform .22s;background:#f2f2f7}
.hidden{display:none!important}

/* ===== iOS 真实通知横幅系统 (Banner Notification) ===== */
.ios-banner{
  position:absolute;
  z-index:400;
  top:calc(env(safe-area-inset-top, 0px) + 10px);
  left:14px;
  right:14px;
  background:rgba(255,255,255,0.88);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border-radius:20px;
  padding:11px 14px;
  box-shadow:0 10px 30px rgba(0,0,0,0.18), inset 0 0 0 0.5px rgba(255,255,255,0.6);
  display:flex;
  gap:12px;
  align-items:center;
  transform:translateY(-140%);
  transition:transform .38s cubic-bezier(0.16, 1, 0.3, 1), opacity .3s ease;
  cursor:pointer;
}
.ios-banner.show{transform:translateY(0)}
.banner-icon{width:38px;height:38px;border-radius:10px;background:#fee500;display:grid;place-items:center;font-size:20px;flex-shrink:0;overflow:hidden}
.banner-icon img{width:100%;height:100%;object-fit:cover}
.banner-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.banner-header{display:flex;justify-content:space-between;align-items:center}
.banner-title{font-size:13.5px;font-weight:700;color:#111}
.banner-time{font-size:11px;color:#8e8e93}
.banner-body{font-size:13px;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 编辑模式标记条 */
.edit-badge-bar{
  position:absolute;
  z-index:115;
  top:calc(env(safe-area-inset-top, 0px) + 34px);
  left:0;right:0;
  background:rgba(255,59,48,0.92);
  color:#fff;
  font-size:10.5px;
  text-align:center;
  padding:3px 0;
  font-weight:600;
  letter-spacing:.3px;
  pointer-events:none;
}

/* ===== 锁屏 ===== */
.lock{color:white;text-align:center;background:transparent}
.lock-date{position:absolute;top:calc(env(safe-area-inset-top, 0px) + 75px);left:0;right:0;font-size:18px;font-weight:550;letter-spacing:.2px;text-shadow:0 1px 8px #3334}
.lock-time{position:absolute;top:calc(env(safe-area-inset-top, 0px) + 102px);left:0;right:0;font-size:92px;font-weight:300;letter-spacing:-5px;line-height:1.1;text-shadow:0 1px 12px #3332;font-variant-numeric:tabular-nums}
.lock-widgets{position:absolute;top:calc(env(safe-area-inset-top, 0px) + 215px);left:8%;right:8%;display:grid;grid-template-columns:1.2fr .8fr .55fr;gap:9px;align-items:center}
.lock-widget{height:60px;border-radius:17px;background:#ffffff26;border:1px solid #ffffff2b;backdrop-filter:blur(24px);padding:9px 8px;text-align:left;font-size:10px;color:white}
.lock-widget strong{font-size:18px;display:block;line-height:1.1}
.lock-widget .mini{display:flex;gap:3px;margin-top:7px}
.lock-widget .mini i{height:10px;flex:1;border-radius:4px;background:#ffffffbf}
.lock-ring{height:55px;width:55px;margin:auto;border:3px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:24px}
.lock-heart{font-size:28px}
.lock-bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom, 0px) + 45px);left:12%;right:12%;display:flex;align-items:center;justify-content:space-between}
.round{width:50px;height:50px;border-radius:50%;background:rgba(40,50,55,.35);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(16px);display:grid;place-items:center;font-size:20px;color:#fff;cursor:pointer}
.lock-hint{position:absolute;bottom:calc(env(safe-area-inset-bottom, 0px) + 16px);left:0;right:0;font-size:12px;color:#ffffffd9;text-shadow:0 1px 5px #555;letter-spacing:.4px;animation:hintUp 2.2s ease-in-out infinite}
@keyframes hintUp{0%,100%{transform:translateY(0);opacity:.85}50%{transform:translateY(-6px);opacity:1}}

/* ===== 主屏幕 ===== */
.home{padding:calc(env(safe-area-inset-top, 0px) + 56px) 5.2% calc(env(safe-area-inset-bottom, 0px) + 120px);overflow-y:auto;overflow-x:hidden;background:transparent}
.home-pages{height:100%;display:flex;width:100%;transition:transform .32s cubic-bezier(.22,.8,.25,1);touch-action:pan-y;will-change:transform}
.home-page{width:100%;flex:0 0 100%;padding:0 4px;min-width:0;box-sizing:border-box}

.home-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:168px 148px;gap:12px;margin-bottom:18px}
.calendar-widget{grid-column:1/3;height:168px;background:#fff;border-radius:22px;padding:14px 16px 12px;display:grid;grid-template-columns:1fr 1.15fr;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.06);cursor:pointer;overflow:hidden}
.cal-left{display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between}
.cal-left .weekday{color:#ff3b30;font-size:13px;font-weight:700;letter-spacing:.2px}
.cal-left .daynum{font-size:52px;line-height:1;font-weight:300;letter-spacing:-2px;color:#111;margin:2px 0 4px}
.cal-left .event{font-size:13px;color:#8e8e93;font-weight:400}
.cal-right{display:flex;flex-direction:column}
.cal-right .month{font-size:12px;color:#ff3b30;font-weight:700;margin-bottom:6px;text-align:right;padding-right:2px}
.weekdays,.cal-days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:1px}
.weekdays{font-size:9px;font-weight:600;margin-bottom:3px;color:#8e8e93}
.cal-days span{height:16px;display:grid;place-items:center;font-size:10px;font-weight:500;color:#111;position:relative}
.cal-days .has-event:after{content:"";position:absolute;bottom:0px;width:3.5px;height:3.5px;border-radius:50%;background:#ff3b30}
.cal-days .selected{background:#ff3b30;color:#fff;border-radius:50%;width:16px;height:16px;margin:auto;font-weight:600}

.weather-widget{height:148px;border-radius:22px;padding:14px 14px 12px;background:linear-gradient(165deg,#1c3a5f 0%,#2a5a8a 45%,#3d7ab0 100%);color:white;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 4px 16px rgba(0,0,0,.1);cursor:pointer;overflow:hidden}
.weather-widget .city{font-size:14px;font-weight:600;opacity:.95}
.weather-widget .temp-row{display:flex;align-items:center;gap:6px;margin:2px 0}
.weather-widget .temp{font-size:46px;font-weight:200;line-height:1;letter-spacing:-1.5px}
.weather-widget .sun{font-size:28px;line-height:1}
.weather-widget .forecast{font-size:12px;line-height:1.35;opacity:.9}

.sleep-widget{height:148px;border-radius:22px;background:#fff;padding:14px 14px 12px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 4px 16px rgba(0,0,0,.06);cursor:pointer;overflow:hidden}
.sleep-title{font-size:14px;color:#5e5ce6;font-weight:700;display:flex;align-items:center;gap:4px}
.sleep-bars{height:48px;display:flex;gap:5px;align-items:flex-end;justify-content:space-between;padding:0 2px}
.sleep-bars i{display:block;width:11%;background:#c7c7cc;border-radius:3px}
.sleep-bars i:nth-child(1){height:70%}.sleep-bars i:nth-child(2){height:92%}.sleep-bars i:nth-child(3){height:78%}
.sleep-bars i:nth-child(4){height:55%}.sleep-bars i:nth-child(5){height:85%}.sleep-bars i:nth-child(6){height:42%}
.sleep-bars i:nth-child(7){height:18%;border-radius:50%;background:#e5e5ea}
.sleep-bottom{font-size:12px;color:#8e8e93}
.sleep-bottom strong{display:block;font-size:15px;color:#8e8e93;font-weight:600;margin-top:1px}

.app-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 6px;align-items:start}
.app{border:0;background:none;color:#171719;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;min-width:0;font:inherit;position:relative}
.app-icon{width:54px;aspect-ratio:1;border-radius:15px;display:grid;place-items:center;font-size:26px;position:relative;overflow:hidden;box-shadow:0 3px 8px rgba(36,52,60,.12),inset 0 0 0 1px rgba(255,255,255,.4)}
.app-icon img{width:100%;height:100%;object-fit:cover}
.app-label{font-size:11px;font-weight:550;color:#182226;text-shadow:0 1px 6px #ffffffb8;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}

/* iOS 桌面小红点 */
.app-badge{
  position:absolute;
  top:-2px;
  right:-2px;
  min-width:14px;
  height:14px;
  border-radius:7px;
  background:var(--red);
  color:#fff;
  border:2px solid #fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:8px;
  font-weight:800;
  pointer-events:none;
  z-index:10;
  box-shadow:0 2px 4px rgba(0,0,0,.2);
}

.calendar-icon{background:#fff;color:#ff3b30;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:8px;font-weight:700;padding-top:4px}
.calendar-icon b{font-size:18px;color:#111;font-weight:300;line-height:1;margin-top:1px}
.clock-icon{background:#fff;color:#111;font-size:28px}
.photos-icon{background:#fff;background-image:radial-gradient(circle at 50% 50%,#ff9500,#ff2d55,#af52de,#007aff,#5856d6);position:relative}
.notes-icon{background:linear-gradient(#ffd60a 0 28%,#fff 28% 100%);color:#c7c7cc;font-size:22px}
.settings-icon{background:linear-gradient(145deg,#e8e8ed,#b0b3b8);color:#5a5a5e;font-size:26px}
.music-icon{background:linear-gradient(145deg,#fc3c77,#c41d78,#6b3fa0);color:#fff;font-size:24px}
.phone-icon{background:linear-gradient(#34c759,#30b350);color:#fff;display:grid;place-items:center;font-size:24px}
.safari-icon{background:linear-gradient(145deg,#fff,#d2e9ff);color:#007aff;font-size:24px}
.kakao-icon{background:#fee500;color:#3c1e1e;position:relative}
.kakao-icon span{width:26px;height:22px;border-radius:50%;background:#3c1e1e;color:#fee500;font-size:0;display:block;position:relative}
.kakao-icon span:before{content:"";position:absolute;bottom:-3px;left:4px;border-width:5px 5px 0 0;border-style:solid;border-color:#3c1e1e transparent transparent;transform:rotate(12deg)}

.dock{position:absolute;bottom:calc(env(safe-area-inset-bottom, 0px) + 20px);left:4%;right:4%;height:72px;border-radius:26px;background:#ffffff8a;border:1px solid #ffffff72;backdrop-filter:blur(20px);box-shadow:0 8px 26px rgba(35,51,58,.1);display:flex;justify-content:space-evenly;align-items:center;padding:0 6px;z-index:10}
.dock .app-icon{width:50px;border-radius:14px}
.home-indicator{position:absolute;z-index:150;bottom:calc(env(safe-area-inset-bottom, 0px) + 6px);left:50%;transform:translateX(-50%);width:116px;height:5px;border-radius:5px;background:#2b3c3c;cursor:pointer;transition:background .2s}
.home-indicator.white{background:#fff}

/* ===== 核心：应用容器完全实色不透背景 ===== */
.app-screen{background:#f2f2f7!important;z-index:20;display:flex;flex-direction:column;color:#111;position:absolute;inset:0}
.app-content{padding:calc(env(safe-area-inset-top, 0px) + 54px) 16px calc(env(safe-area-inset-bottom, 0px) + 40px);overflow-y:auto;flex:1;overscroll-behavior:contain;background:#f2f2f7}
.section-label{font-size:13px;color:#6d6d72;margin:16px 4px 8px;font-weight:500}
.list-card{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:18px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #e6e6eb;cursor:pointer;min-height:58px}
.row:last-child{border-bottom:0}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#e5e5ea;font-size:16px;font-weight:600;flex-shrink:0;color:#555;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.blue{background:#d7e9fc;color:#1672d6}
.avatar.pink{background:#fcdbe4;color:#d92d64}
.avatar.green{background:#d9f1dd;color:#1f9435}
.row-main{min-width:0;flex:1}
.row-title{font-size:15px;font-weight:600;margin-bottom:2px}
.row-sub{font-size:12px;color:#8e8e93;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-time{font-size:11px;color:#8e8e93;align-self:flex-start;margin-top:4px}

/* 详情展示 */
.detail-screen{background:#fff!important;z-index:26;display:flex;flex-direction:column;position:absolute;inset:0}
.detail-nav{padding:calc(env(safe-area-inset-top, 0px) + 48px) 16px 12px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;color:var(--blue);font-size:15px;background:#fff}
.detail-body{padding:22px 20px;overflow-y:auto;line-height:1.75;font-size:15px;background:#fff;flex:1}
.detail-body h2{font-size:22px;line-height:1.25;margin:0 0 8px}
.detail-body .meta{color:#8e8e93;font-size:12px;margin-bottom:18px}
.photo-detail{background:#000!important;color:#fff;z-index:30;display:flex;flex-direction:column;position:absolute;inset:0}
.photo-nav{padding:calc(env(safe-area-inset-top, 0px) + 48px) 16px 12px;display:flex;align-items:center;justify-content:space-between;color:#fff;font-size:14px;background:#000}
.photo-art{flex:1;display:grid;place-items:center;font-size:110px;background:radial-gradient(ellipse at 50% 45%,#343434,#080808 75%);overflow:hidden}
.photo-art img{max-width:100%;max-height:100%;object-fit:contain}
.photo-caption{padding:14px 20px 40px;font-size:13px;line-height:1.6;color:#ddd;background:#000}
.photo-caption strong{font-size:16px;color:#fff}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.photo-thumb{aspect-ratio:1;background:linear-gradient(145deg,#d8d8d8,#6c7070);display:grid;place-items:center;font-size:34px;cursor:pointer;position:relative;overflow:hidden}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.note{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04);cursor:pointer}
.note h3{font-size:16px;margin:0 0 6px;font-weight:650}
.note p{font-size:13px;color:#65656a;line-height:1.6;margin:0 0 8px;white-space:pre-line}
.note time{font-size:10px;color:#a0a0a5}

/* =========================================================
   ===== KAKAO TALK 页面 =====
   ========================================================= */
.kkt-screen{background:#fff!important;z-index:20;display:flex;flex-direction:column;position:absolute;inset:0}
.kkt-main-container{flex:1;display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden;background:#fff}

.kkt-header{
  padding:calc(env(safe-area-inset-top, 0px) + 40px) 18px 12px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-shrink:0;
  border-bottom:1px solid #ededed;
}
.kkt-header-left{display:flex;align-items:baseline;gap:8px}
.kkt-header-left h1{font-size:24px;font-weight:800;color:#191919;margin:0;letter-spacing:-.5px}
.kkt-header-right{display:flex;align-items:center;gap:18px;font-size:18px;color:#2c2c2e;cursor:pointer}

.kkt-tab-content{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}

.kkt-chat-item{
  display:flex;
  align-items:center;
  padding:12px 18px;
  gap:14px;
  cursor:pointer;
  position:relative;
  transition:background .15s;
}
.kkt-chat-item:active{background:#f4f4f4}
.kkt-av-wrap{position:relative;flex-shrink:0}
.kkt-avatar{
  width:50px;
  height:50px;
  border-radius:18px;
  background:#f2f2f7;
  display:grid;
  place-items:center;
  font-size:17px;
  font-weight:650;
  color:#333;
  overflow:hidden;
}
.kkt-avatar img{width:100%;height:100%;object-fit:cover}
.kkt-avatar.pink{background:#ffe3ec;color:#e63968}
.kkt-avatar.blue{background:#e0efff;color:#1877f2}
.kkt-avatar.group{background:#e8f5e9;color:#2e7d32}
.kkt-avatar.friend{background:#fdf2e9;color:#e67e22}

.kkt-chat-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.kkt-name-row{display:flex;align-items:center;justify-content:space-between}
.kkt-name{font-size:16px;font-weight:600;color:#191919;letter-spacing:-.3px}
.kkt-count{font-size:12px;color:#999;margin-left:4px;font-weight:400}
.kkt-time{font-size:11px;color:#aaa}
.kkt-preview-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.kkt-preview{font-size:13px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.kkt-badge{
  min-width:18px;
  height:18px;
  border-radius:9px;
  background:#ff3b30;
  color:#fff;
  font-size:10px;
  font-weight:700;
  display:inline-grid;
  place-items:center;
  padding:0 5px;
  flex-shrink:0;
}

.kkt-profile-self{display:flex;align-items:center;padding:14px 18px 18px;gap:14px;border-bottom:1px solid #f2f2f2}
.kkt-profile-self .kkt-avatar{width:56px;height:56px;border-radius:20px;background:#e3e8f8;color:#3f51b5;font-size:19px}
.kkt-subhead{padding:10px 18px 4px;font-size:12px;color:#929292;font-weight:500}

.kkt-navbar{
  flex-shrink:0;
  height:calc(56px + env(safe-area-inset-bottom, 0px));
  padding-bottom:env(safe-area-inset-bottom, 0px);
  background:#fafafa;
  border-top:1px solid #e7e7e7;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  align-items:center;
  z-index:20;
}
.kkt-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#b2b2b2;cursor:pointer;position:relative;height:100%}
.kkt-tab.active{color:#191919}
.kkt-tab-icon{font-size:20px;line-height:1.1}
.kkt-tab-label{font-size:10px;margin-top:2px;font-weight:500}
.kkt-nav-badge{position:absolute;top:6px;right:calc(50% - 20px);background:#ff3b30;color:#fff;font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:grid;place-items:center;padding:0 3px}
.kkt-tab-icon{height:23px;display:flex;align-items:center;justify-content:center}
.kkt-tab-icon svg{width:23px;height:23px;display:block}
.kkt-tab.active .kkt-tab-icon svg{stroke-width:2}

/* ===== 学校公告 ===== */
.notice-hero{display:flex;align-items:center;gap:14px;margin:16px;padding:18px 16px;border-radius:18px;background:linear-gradient(135deg,#123a5e,#1f5c8b);color:#fff;box-shadow:0 8px 20px rgba(12,44,72,.18)}
.notice-hero-icon{width:46px;height:46px;border-radius:14px;background:#ffffff26;border:1px solid #ffffff2e;display:grid;place-items:center;font-size:23px;flex-shrink:0}
.notice-hero-title{font-size:16px;font-weight:700;letter-spacing:.3px}
.notice-hero-sub{font-size:11.5px;opacity:.78;margin-top:3px}
.notice-item{display:flex;align-items:flex-start;gap:13px;padding:14px 18px;cursor:pointer;border-bottom:1px solid #f0f0f0;background:#fff}
.notice-item:last-child{border-bottom:0}
.notice-item:active{background:#f7f7f7}
.notice-av{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,#eef3f8,#dbe6f0);color:#26547c;display:grid;place-items:center;font-size:20px;flex-shrink:0;position:relative}
.notice-main{flex:1;min-width:0}
.notice-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.notice-title{font-size:14.5px;font-weight:650;color:#191919;line-height:1.4}
.notice-date{font-size:10.5px;color:#aaa;white-space:nowrap;flex-shrink:0}
.notice-preview{font-size:12px;color:#8a8a8a;line-height:1.5;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.notice-new{display:inline-block;font-size:9px;font-weight:800;color:#fff;background:#ff3b30;border-radius:8px;padding:1px 6px;margin-left:6px;vertical-align:1px;letter-spacing:.5px}
.notice-dot{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:#ff3b30;border:2px solid #fff}
.notice-foot{text-align:center;font-size:10.5px;color:#b0b0b0;padding:18px 0 8px;letter-spacing:.5px}

/* ===== 公告详情 / 调查问卷 ===== */
.kkt-notice-detail{position:absolute;inset:0;z-index:36;background:#f2f2f7;display:flex;flex-direction:column}
.notice-topbar{background:#fff!important;border-bottom:1px solid #ebebeb!important;color:#191919}
.kkt-notice-body{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:16px 14px calc(env(safe-area-inset-bottom, 0px) + 30px)}
.notice-article{background:#fff;border-radius:6px;padding:26px 22px 30px;box-shadow:0 2px 14px rgba(20,34,48,.06)}
.notice-article .dept{text-align:center;font-size:11px;letter-spacing:2px;color:#999;margin-bottom:14px}
.notice-article h1{font-size:20px;line-height:1.5;text-align:center;margin:0 0 8px;color:#1a1a1a;letter-spacing:.5px}
.notice-article .date{text-align:center;font-size:11px;color:#aaa;margin-bottom:22px}
.notice-article p{font-size:14px;line-height:1.95;color:#333;margin:0 0 13px;text-indent:2em}
.notice-article .sign{text-align:right;font-size:13px;color:#444;line-height:1.9;margin-top:28px;text-indent:0}
.notice-article .rule{height:1px;background:#e6e2dc;margin:20px 0}

.survey-paper{background:#fff;border-radius:3px;padding:26px 20px 30px;box-shadow:0 2px 16px rgba(20,34,48,.08);position:relative;font-family:"Songti SC","STSong","SimSun",serif}
.survey-org{text-align:center;font-size:11px;letter-spacing:3px;color:#8a8a8a;margin-bottom:10px}
.survey-title{font-size:21px;font-weight:800;text-align:center;letter-spacing:1px;line-height:1.5;color:#1a1a1a;margin:0 0 2px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.survey-sub{text-align:center;font-size:10.5px;color:#b0b0b0;letter-spacing:4px;margin-bottom:16px}
.survey-meta{border-top:1.5px solid #222;border-bottom:1.5px solid #222;padding:10px 2px;font-size:12px;line-height:2;color:#333;margin-bottom:20px}
.survey-meta b{font-weight:600;color:#111}
.survey-p{font-size:13.5px;line-height:2;color:#222;margin:0 0 8px;text-indent:2em}
.survey-part{font-size:14.5px;font-weight:800;color:#111;margin:26px 0 14px;padding:6px 10px;background:#f6f3ee;border-left:3px solid #a8322a;letter-spacing:.5px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.survey-q{margin:0 0 22px;padding-left:2px;border-radius:6px}
.survey-q-title{font-size:13.5px;font-weight:600;line-height:1.85;color:#111;margin-bottom:7px}
.survey-q-title .q-note{display:block;font-weight:400;color:#777;font-size:12px;margin-top:2px}
.survey-opt{display:flex;align-items:flex-start;gap:8px;padding:4.5px 0 4.5px 4px;cursor:pointer;position:relative}
.survey-opt input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.survey-mark{width:15px;height:15px;flex:0 0 15px;border:1.4px solid #444;border-radius:50%;margin-top:2px;display:grid;place-items:center;background:#fff;transition:.15s}
.survey-opt input:checked + .survey-mark{border-color:#a8322a}
.survey-opt input:checked + .survey-mark:after{content:"";width:7px;height:7px;border-radius:50%;background:#a8322a}
.survey-opt input[type=checkbox] + .survey-mark{border-radius:2.5px}
.survey-opt input[type=checkbox]:checked + .survey-mark{background:#a8322a;border-color:#a8322a}
.survey-opt input[type=checkbox]:checked + .survey-mark:after{content:"";width:4px;height:8px;border:1.8px solid #fff;border-top:0;border-left:0;transform:rotate(42deg);margin-top:-2px;border-radius:0;background:none}
.survey-opt-text{font-size:13px;line-height:1.65;color:#2c2c2c}
.survey-textarea{width:100%;min-height:96px;border:1px solid #d9d4cd;border-radius:2px;background:#fff;padding:10px 12px;font-family:inherit;font-size:13px;line-height:2;color:#222;outline:none;resize:none;display:block}
.survey-textarea:focus{border-color:#a8322a;box-shadow:0 0 0 3px #a8322a14}
.survey-line-label{font-size:12.5px;color:#555;margin:12px 0 6px}
.survey-other-row{display:flex;align-items:flex-start;gap:6px;padding:4px 0 4px 4px}
.survey-other-row .survey-opt{padding:0;flex:0 0 auto}
.survey-inline{flex:1;border:0;border-bottom:1px solid #b9b3ac;background:transparent;font-family:inherit;font-size:13px;padding:2px 4px;outline:none;min-width:0;border-radius:0}
.survey-alert{position:sticky;top:0;z-index:5;background:#fff4e5;color:#8a4b00;border:1px solid #f1d3a8;border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:14px;box-shadow:0 4px 10px rgba(0,0,0,.05)}
.survey-q.missing{background:#fff3f2;box-shadow:0 0 0 1px #e8b4ae inset;padding:10px}
.survey-submit-area{margin-top:28px;padding-top:18px;border-top:1px dashed #d8d2ca;text-align:center}
.survey-tip{font-size:10.5px;color:#999;line-height:1.7;margin-bottom:14px}
.survey-submit-btn{width:100%;max-width:280px;border:0;border-radius:10px;background:#a8322a;color:#fff;font-size:15px;font-weight:700;letter-spacing:2px;padding:13px 0;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;box-shadow:0 6px 16px rgba(168,50,42,.25)}
.survey-submit-btn:active{transform:translateY(1px);opacity:.92}
.survey-foot{font-size:12px;color:#444;line-height:2;margin-top:22px;text-align:left;text-indent:0}
.survey-done{padding:38px 22px 34px;text-align:center;background:#fff;border-radius:8px;box-shadow:0 2px 16px rgba(20,34,48,.08)}
.survey-done-icon{width:64px;height:64px;border-radius:50%;background:#eaf6ee;color:#2e9e4f;display:grid;place-items:center;font-size:31px;margin:0 auto 16px}
.survey-done h2{font-size:19px;margin:0 0 8px;color:#191919}
.survey-done .done-sub{font-size:13px;color:#777;line-height:1.8;margin:0 0 22px}
.done-card{background:#fafaf8;border:1px solid #eeeae4;border-radius:10px;padding:6px 14px;text-align:left;margin-bottom:20px}
.done-card div{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:9px 0;border-bottom:1px solid #efebe5}
.done-card div:last-child{border-bottom:0}
.done-card span{color:#999}
.done-card b{color:#222;font-weight:600;text-align:right}
.done-note{font-size:11px;color:#999;line-height:1.9;margin:0 0 22px}

/* 私聊房间 */
.kkt-room{
  position:absolute;
  inset:0;
  background:var(--kkt-bg);
  z-index:30;
  display:flex;
  flex-direction:column;
  transition:transform .22s cubic-bezier(.2,.8,.25,1);
}
.kkt-room-top{
  padding:calc(env(safe-area-inset-top, 0px) + 38px) 14px 12px;
  background:var(--kkt-bg);
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-shrink:0;
  border-bottom:1px solid rgba(0,0,0,.04);
}
.kkt-room-back{border:0;background:none;font-size:24px;color:#191919;cursor:pointer;padding:0 8px;line-height:1}
.kkt-room-title{flex:1;text-align:center;overflow:hidden;padding:0 4px}
.kkt-room-title strong{font-size:16.5px;font-weight:700;color:#191919;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.kkt-room-actions{display:flex;gap:14px;font-size:18px;color:#191919;cursor:pointer;padding-right:4px}

.kkt-messages-flow{
  flex:1;
  padding:12px 12px 18px;
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.kkt-date-pill{
  align-self:center;
  background:rgba(0,0,0,.15);
  color:#fff;
  font-size:11px;
  padding:3px 12px;
  border-radius:12px;
  margin:8px 0 2px;
  text-shadow:0 1px 1px rgba(0,0,0,.1);
}

.kkt-msg-row{display:flex;gap:8px;max-width:100%;align-items:flex-start}
.kkt-msg-row.them{justify-content:flex-start}
.kkt-msg-row.me{justify-content:flex-end}
.kkt-msg-av{width:38px;height:38px;border-radius:15px;display:grid;place-items:center;font-size:14px;font-weight:600;flex-shrink:0;overflow:hidden}
.kkt-msg-av img{width:100%;height:100%;object-fit:cover}
.kkt-msg-av.pink{background:#ffe3ec;color:#e63968}
.kkt-msg-av.blue{background:#e0efff;color:#1877f2}
.kkt-msg-av.friend{background:#fdf2e9;color:#e67e22}
.kkt-msg-av.group{background:#e8f5e9;color:#2e7d32}

.kkt-msg-content{display:flex;flex-direction:column;gap:3px;max-width:76%}
.kkt-msg-sender{font-size:11px;color:#556673;margin-left:2px;margin-bottom:2px}

.kkt-bubble-wrap{display:flex;align-items:flex-end;gap:5px}
.kkt-msg-row.them .kkt-bubble-wrap{flex-direction:row}
.kkt-msg-row.me .kkt-bubble-wrap{flex-direction:row-reverse}

.kkt-bubble{
  max-width:100%;
  padding:8.5px 12.5px;
  border-radius:14px;
  font-size:14.5px;
  line-height:1.45;
  color:#191919;
  word-break:break-word;
  white-space:pre-wrap;
  position:relative;
  box-shadow:0 1px 2px rgba(0,0,0,.04);
}
.kkt-msg-row.them .kkt-bubble{background:var(--kkt-chat-bubble);border-top-left-radius:3px}
.kkt-msg-row.me .kkt-bubble{background:var(--kkt-yellow);border-top-right-radius:3px}

.kkt-msg-time{
  font-size:10px;
  color:#617282;
  white-space:nowrap;
  flex-shrink:0;
  margin-bottom:2px;
}

.kkt-typing{display:flex;align-items:center;gap:4px;padding:9px 14px;background:#ffffffd4;border-radius:14px;width:fit-content}
.kkt-typing-dot{width:6px;height:6px;border-radius:50%;background:#8e9fae;animation:typingBounce 1.2s infinite ease-in-out}
.kkt-typing-dot:nth-child(2){animation-delay:.2s}
.kkt-typing-dot:nth-child(3){animation-delay:.4s}
@keyframes typingBounce{0%,80%,100%{transform:scale(0.8);opacity:.4}40%{transform:scale(1.2);opacity:1}}

.kkt-reply-panel{
  background:#f6f6f6;
  border-top:1px solid #dedede;
  padding:10px 12px calc(env(safe-area-inset-bottom, 0px) + 8px);
  display:flex;
  flex-direction:column;
  gap:8px;
  flex-shrink:0;
}
.kkt-choice-grid{display:flex;flex-direction:column;gap:7px}
.kkt-choice-btn{
  background:#fff;
  border:1px solid #d3dbe3;
  border-radius:16px;
  padding:10px 14px;
  font-size:13.5px;
  font-weight:500;
  color:#191919;
  cursor:pointer;
  text-align:left;
  transition:all .15s;
  box-shadow:0 1px 3px rgba(0,0,0,.03);
  word-break:break-word;
}
.kkt-choice-btn:active{background:#fee500;border-color:#e4cd00}

.kkt-fake-input-bar{display:flex;align-items:center;gap:8px}
.kkt-input-plus{font-size:22px;color:#6d7b88;cursor:pointer;line-height:1}
.kkt-input-mock{
  flex:1;
  background:#fff;
  border:1px solid #dcdfe3;
  border-radius:18px;
  padding:8px 14px;
  font-size:13px;
  color:#9a9a9a;
  min-height:36px;
  display:flex;
  align-items:center;
}
.kkt-send-icon{font-size:20px;color:#9aa9b5}

/* ===== 真实聊天细节 ===== */
.kkt-room-sub{display:block;font-size:10.5px;color:#617282;font-weight:500;margin-top:1px;letter-spacing:0}
.kkt-room.push-in{animation:kktRoomIn .28s cubic-bezier(.2,.8,.25,1)}
.kkt-room.push-out{animation:kktRoomOut .24s cubic-bezier(.4,0,1,1) forwards}
@keyframes kktRoomIn{from{transform:translateX(100%);box-shadow:-12px 0 30px rgba(0,0,0,.12)}to{transform:translateX(0);box-shadow:0 0 0 rgba(0,0,0,0)}}
@keyframes kktRoomOut{from{transform:translateX(0)}to{transform:translateX(100%)}}

.kkt-chat-item.flash{animation:kktRowFlash 1.1s ease}
@keyframes kktRowFlash{0%{background:#fff7c7}100%{background:transparent}}
.kkt-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:96px 32px 40px;text-align:center;color:#b0b0b0;gap:8px}
.kkt-empty .big{font-size:46px;line-height:1;opacity:.35;margin-bottom:6px}
.kkt-empty .t{font-size:15px;font-weight:600;color:#8e8e93}
.kkt-empty .s{font-size:12px;line-height:1.6;color:#b0b0b0}

.kkt-msg-row{transition:opacity .2s}
.kkt-msg-row.arrive{animation:kktMsgIn .3s cubic-bezier(.2,.8,.25,1)}
@keyframes kktMsgIn{from{opacity:0;transform:translateY(9px) scale(.985)}to{opacity:1;transform:none}}
.kkt-msg-row.first .kkt-msg-av{visibility:visible}
.kkt-msg-row:not(.first) .kkt-msg-av{visibility:hidden}
.kkt-msg-row.them .kkt-bubble{border-top-left-radius:14px}
.kkt-msg-row.them.first .kkt-bubble{border-top-left-radius:3px}
.kkt-msg-row.them.last .kkt-bubble{border-bottom-left-radius:4px}
.kkt-msg-row.me .kkt-bubble{border-top-right-radius:14px}
.kkt-msg-row.me.first .kkt-bubble{border-top-right-radius:3px}
.kkt-msg-row.me.last .kkt-bubble{border-bottom-right-radius:4px}
.kkt-msg-row:not(.last) .kkt-msg-time{display:none}
.kkt-msg-row:not(.first) .kkt-msg-sender{display:none}
.kkt-msg-row.first .kkt-msg-content{margin-top:2px}
.kkt-msg-row.last{margin-bottom:4px}
.kkt-new-divider{align-self:center;font-size:10.5px;color:#fff;background:rgba(0,0,0,.18);padding:3px 12px;border-radius:11px;margin:3px 0 1px;letter-spacing:.2px}

.kkt-choice-label{font-size:10.5px;color:#8a8a8a;font-weight:600;letter-spacing:.6px;padding:0 4px 1px;display:flex;align-items:center;gap:6px}
.kkt-choice-label:before{content:"";width:5px;height:5px;border-radius:50%;background:#e4cd00}
.kkt-choice-btn{
  background:#fff;
  border:1px solid #d3dbe3;
  border-radius:16px;
  padding:10px 14px;
  font-size:13.5px;
  font-weight:500;
  color:#191919;
  cursor:pointer;
  text-align:left;
  transition:all .15s;
  box-shadow:0 1px 3px rgba(0,0,0,.03);
  word-break:break-word;
  position:relative;
  padding-left:15px;
}
.kkt-choice-btn:before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:#fee500}
.kkt-choice-btn:active{background:#fee500;border-color:#e4cd00;transform:scale(.995)}

/* 锁屏消息通知 */
.lock-notifs{position:absolute;z-index:5;top:calc(env(safe-area-inset-top, 0px) + 292px);left:7%;right:7%;display:flex;flex-direction:column;gap:8px;max-height:calc(100% - 410px);overflow:hidden}
.lock-notif{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.82);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 6px 20px rgba(20,35,45,.16),inset 0 0 0 .5px rgba(255,255,255,.7);cursor:pointer;animation:lockNotifFade .3s ease both;text-align:left}
.lock-notif:active{transform:scale(.985)}
@keyframes lockNotifFade{from{opacity:.45}to{opacity:1}}
.lock-notif-icon{width:36px;height:36px;border-radius:10px;background:#fee500;display:grid;place-items:center;font-size:18px;flex:0 0 36px;overflow:visible;color:#3c1e1e;position:relative}
.lock-notif-icon img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.lock-notif-body{flex:1;min-width:0}
.lock-notif-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.lock-notif-name{font-size:12.5px;font-weight:700;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lock-notif-time{font-size:10px;color:#8e8e93;flex-shrink:0}
.lock-notif-text{font-size:12px;color:#3a3a3c;line-height:1.35;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.lock-notif-count{position:absolute;top:-6px;right:-6px;min-width:16px;height:16px;border-radius:8px;background:#ff3b30;color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:1.5px solid #fff}
.lock-notif{position:relative}

/* 设置二级页 */
.app-subnav{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top, 0px) + 4px) 16px 10px;background:#f2f2f7;position:sticky;top:0;z-index:6;margin:-6px -16px 6px}
.app-subnav button{border:0;background:none;color:var(--blue);font-size:15px;cursor:pointer;padding:0}
.app-subnav strong{font-size:15px;color:#111}

/* 屏幕切换动画 */
.screen.screen-enter{animation:screenEnter .26s cubic-bezier(.2,.8,.25,1)}
@keyframes screenEnter{from{opacity:0;transform:scale(.988)}to{opacity:1;transform:none}}

/* 悬浮球 AssistiveTouch */
.assistive-touch{
  position:absolute;
  z-index:300;
  width:54px;
  height:54px;
  border-radius:14px;
  background:rgba(0,0,0,0.45);
  box-shadow:0 4px 16px rgba(0,0,0,0.35),inset 0 0 0 1px rgba(255,255,255,0.25);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:grab;
  user-select:none;
  touch-action:none;
  opacity:.5;
  transition:opacity .3s ease;
}
.assistive-touch:active,.assistive-touch.dragging{cursor:grabbing;opacity:.95}
.assistive-touch .inner-circle{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.85);box-shadow:0 0 0 2.5px rgba(255,255,255,0.3),0 0 10px rgba(0,0,0,0.25);pointer-events:none}

/* 全局编辑弹窗 */
.edit-modal-mask{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(10px);
  z-index:500;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.edit-modal{
  background:#fff;
  width:100%;
  max-width:380px;
  border-radius:20px;
  padding:18px;
  box-shadow:0 12px 30px rgba(0,0,0,0.3);
  display:flex;
  flex-direction:column;
  gap:12px;
}
.edit-modal h3{margin:0;font-size:17px;font-weight:700}
.edit-modal input, .edit-modal textarea{
  width:100%;
  border:1px solid #dcdfe3;
  border-radius:10px;
  padding:10px 12px;
  font-family:inherit;
  font-size:14px;
  outline:none;
}
.edit-modal textarea{resize:none;height:90px}
.edit-modal-btns{display:flex;gap:10px;justify-content:flex-end}
.edit-btn{padding:8px 16px;border-radius:12px;border:0;font-size:14px;font-weight:600;cursor:pointer}
.edit-btn.cancel{background:#e5e5ea;color:#333}
.edit-btn.confirm{background:#007aff;color:#fff}

/* 主语言底部选择 */
.lang-mask{position:absolute;inset:0;z-index:650;background:rgba(0,0,0,.38);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.lang-sheet{width:100%;max-width:480px;background:#f2f2f7;border-radius:20px 20px 0 0;padding:10px 12px calc(env(safe-area-inset-bottom, 0px) + 12px);animation:sheetFade .2s ease both}
@keyframes sheetFade{from{opacity:.85}to{opacity:1}}
.lang-head{display:flex;align-items:center;justify-content:space-between;padding:8px 8px 10px}
.lang-head strong{font-size:15px;color:#111}
.lang-head button{border:0;background:none;color:#007aff;font-size:15px;cursor:pointer;padding:0}
.lang-option{display:flex;align-items:center;justify-content:space-between;background:#fff;padding:14px 16px;border-bottom:1px solid #ececef;cursor:pointer}
.lang-option:first-child{border-radius:14px 14px 0 0}
.lang-option:last-child{border-radius:0 0 14px 14px;border-bottom:0}
.lang-option .nm{font-size:15px;font-weight:550;color:#111}
.lang-option .sub{font-size:11px;color:#999;margin-top:2px}
.lang-option .ck{color:#007aff;font-weight:700;font-size:16px;min-width:18px;text-align:right}
</style>
</head>
<body>
<div class="stage">
<main class="phone" id="phone">
  <div class="wallpaper"></div>

  <!-- iOS 模拟真实顶部通知横幅 -->
  <div class="ios-banner" id="iosBanner" onclick="onBannerClick()">
    <div class="banner-icon" id="bannerIcon">💬</div>
    <div class="banner-info">
      <div class="banner-header">
        <span class="banner-title" id="bannerTitle">KakaoTalk</span>
        <span class="banner-time">现在</span>
      </div>
      <div class="banner-body" id="bannerBody">新消息内容预览</div>
    </div>
  </div>

  <div class="edit-badge-bar hidden" id="editBadgeBar">⚡ 创作者编辑模式已开启（双击任意元素或头像即可修改）</div>

  <!-- 顶部状态栏 -->
  <div class="status white" id="status">
    <span id="statusTime">19:25</span>
    <div class="status-right">
      <div class="signal"><i></i><i></i><i></i><i></i></div>
      <div class="wifi"></div>
      <div class="battery"><span id="batteryNum">81</span></div>
    </div>
  </div>
  <div class="island"></div>

  <!-- 隐藏的全局文件选择器 -->
  <input type="file" id="globalImgPicker" accept="image/*" style="display:none">

  <!-- 锁屏 -->
  <section class="screen lock" id="lockScreen">
    <div class="lock-date" id="lockDate">10月24日 星期六</div>
    <div class="lock-time" id="lockTime">19:25</div>
    <div class="lock-widgets">
      <div class="lock-widget"><div id="lockWeekLabel">本周 <strong>78%</strong></div><div class="mini"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
      <div class="lock-ring">▯</div>
      <div class="lock-heart">♥</div>
    </div>
    <!-- 锁屏消息通知 -->
    <div class="lock-notifs" id="lockNotifs"></div>
    <div class="lock-bottom">
      <button class="round" onclick="event.stopPropagation();triggerBannerNotification('系统', '手电筒', '手电筒已开启')" title="Flashlight">🔦</button>
      <div style="font-size:17px;color:#273838">🐾 🧸 🐈</div>
      <button class="round" onclick="event.stopPropagation();openApp('camera')" title="Camera">📷</button>
    </div>
    <div class="lock-hint" id="lockHint" data-i18n="lock_hint">轻点或向上滑动以解锁</div>
  </section>

  <!-- 主屏幕 -->
  <section class="screen home hidden" id="homeScreen">
    <div class="home-pages" id="homePages">
      <div class="home-page">
        <div class="home-grid">
          <div class="calendar-widget" onclick="openApp('calendar')">
            <div class="cal-left">
              <div class="weekday" id="calWeek">星期六</div>
              <div class="daynum" id="calDay">24</div>
              <div class="event" id="calEvent" data-i18n="today_event">今日日程</div>
            </div>
            <div class="cal-right">
              <div class="month" id="calMonth">10月</div>
              <div class="weekdays" id="calWeekdays"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
              <div class="cal-days" id="calDays"></div>
            </div>
          </div>
          <div class="weather-widget" onclick="openApp('weather')">
            <div>
              <div class="city" id="weatherCity">首尔 ↗</div>
              <div class="temp-row"><span class="temp">22°</span><span class="sun">☀️</span></div>
            </div>
            <div class="forecast" id="weatherForecast">多云间晴<br>最高 28° 最低 21°</div>
          </div>
          <div class="sleep-widget" onclick="openApp('clock')">
            <div class="sleep-title" id="sleepTitle">◷ 作息</div>
            <div class="sleep-bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
            <div class="sleep-bottom" id="sleepBottom">晚自习时间<strong>19:00 - 22:00</strong></div>
          </div>
        </div>
        <div class="app-grid">
          <button class="app" onclick="openApp('calendar')" ondblclick="onAppIconDblClick('calendar')">
            <span class="app-icon calendar-icon" id="icon_calendar"><span id="calIconWeek">SAT</span><b id="calIconDay">24</b></span>
            <span class="app-label" data-i18n="app_calendar">日历</span>
          </button>
          <button class="app" onclick="openApp('clock')" ondblclick="onAppIconDblClick('clock')">
            <span class="app-icon clock-icon" id="icon_clock">◷</span>
            <span class="app-label" data-i18n="app_clock">时钟</span>
          </button>
          <button class="app" onclick="openApp('photos')" ondblclick="onAppIconDblClick('photos')">
            <span class="app-icon photos-icon" id="icon_photos"></span>
            <span class="app-badge" id="badge_photos" style="display:none">●</span>
            <span class="app-label" data-i18n="app_photos">照片</span>
          </button>
          <button class="app" onclick="openApp('notes')" ondblclick="onAppIconDblClick('notes')">
            <span class="app-icon notes-icon" id="icon_notes">☰</span>
            <span class="app-badge" id="badge_notes" style="display:none">●</span>
            <span class="app-label" data-i18n="app_notes">备忘录</span>
          </button>
          <button class="app" onclick="openApp('music')" ondblclick="onAppIconDblClick('music')">
            <span class="app-icon music-icon" id="icon_music">♫</span>
            <span class="app-label" data-i18n="app_music">音乐</span>
          </button>
          <button class="app" onclick="openApp('safari')" ondblclick="onAppIconDblClick('safari')">
            <span class="app-icon safari-icon" id="icon_safari">🧭</span>
            <span class="app-badge" id="badge_safari" style="display:none">●</span>
            <span class="app-label">Safari</span>
          </button>
          <button class="app" onclick="openKKT()" ondblclick="onAppIconDblClick('kakao')">
            <span class="app-icon kakao-icon" id="icon_kakao"><span>●</span></span>
            <span class="app-badge" id="badge_kakao" style="display:none">0</span>
            <span class="app-label">KakaoTalk</span>
          </button>
          <button class="app" onclick="openApp('settings')" ondblclick="onAppIconDblClick('settings')">
            <span class="app-icon settings-icon" id="icon_settings">⚙</span>
            <span class="app-label" data-i18n="app_settings">设置</span>
          </button>
        </div>
      </div>
    </div>
    <!-- 桌面独占 Dock -->
    <div class="dock" id="homeDock">
      <button class="app" onclick="openApp('phone')"><span class="app-icon phone-icon">📞</span></button>
      <button class="app" onclick="openKKT()"><span class="app-icon kakao-icon"><span>●</span></span><span class="app-badge" id="badge_kakao_dock" style="display:none">0</span></button>
      <button class="app" onclick="openApp('photos')"><span class="app-icon photos-icon"></span></button>
      <button class="app" onclick="openApp('settings')"><span class="app-icon settings-icon">⚙</span></button>
    </div>
  </section>

  <!-- 原生基础 App 容器 (全屏实底色覆盖，绝不露背景) -->
  <section class="screen app-screen hidden" id="appScreen">
    <div class="app-content" id="appContent"></div>
  </section>

  <!-- 详情展示 -->
  <section class="screen detail-screen hidden" id="detailView">
    <div class="detail-nav">
      <button class="back" onclick="goHome()" style="border:0;background:none;color:var(--blue);font-size:16px;cursor:pointer">‹ 桌面</button>
      <span id="detailHeader" style="font-weight:600">详情</span>
      <span style="width:36px"></span>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </section>

  <!-- 照片全屏详情 -->
  <section class="screen photo-detail hidden" id="photoDetail">
    <div class="photo-nav">
      <button onclick="openApp('photos')" style="border:0;background:none;color:white;font-size:14px;cursor:pointer">‹ 所有照片</button>
      <span id="photoDate">9月 3日</span>
      <span onclick="uploadPhotoCurrent()" style="cursor:pointer;color:var(--blue)">替换图片</span>
    </div>
    <div class="photo-art" id="photoArt" ondblclick="uploadPhotoCurrent()">🏫</div>
    <div class="photo-caption" id="photoCaption"></div>
  </section>

  <!-- KAKAO TALK 页面 -->
  <section class="screen kkt-screen hidden" id="kktScreen">
    <div class="kkt-main-container">
      <header class="kkt-header">
        <div class="kkt-header-left">
          <h1 id="kktTitle">聊天</h1>
        </div>
        <div class="kkt-header-right">
          <span onclick="triggerBannerNotification('KakaoTalk', '搜索', '支持全局聊天记录关键词检索')">⌕</span>
          <span onclick="triggerBannerNotification('KakaoTalk', '发起群聊', '已选择邀请班级同学')">＋</span>
          <span onclick="resetKktStory()" title="重置剧情">↺</span>
        </div>
      </header>

      <div class="kkt-tab-content" id="kktTabContent">
        <div id="kktChatListTab"></div>
        <div id="kktFriendsTab" class="hidden"></div>
        <div id="kktMoreTab" class="hidden"></div>
      </div>

      <nav class="kkt-navbar">
        <div class="kkt-tab" id="kktNavFriends" onclick="switchKktTab('friends')">
          <div class="kkt-tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.6 19c.4-3 2.6-4.7 5.4-4.7s5 1.7 5.4 4.7"/><path d="M15.6 5.1a3.2 3.2 0 0 1 0 5.8"/><path d="M17.6 14.5c2 .5 3.3 2 3.6 4.5"/></svg></div>
          <div class="kkt-tab-label" data-i18n="kkt_friends">好友</div>
        </div>
        <div class="kkt-tab active" id="kktNavChats" onclick="switchKktTab('chats')">
          <div class="kkt-tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.4c0 3.9-3.8 7.1-8.5 7.1-1 0-2-.15-2.9-.42L4.2 20l1.2-3.5c-1.3-1.4-1.9-3.1-1.9-5.1 0-3.9 3.8-7.1 8.5-7.1s8.5 3.2 8.5 7.1Z"/><circle cx="8.5" cy="11.4" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="11.4" r="1" fill="currentColor" stroke="none"/><circle cx="15.5" cy="11.4" r="1" fill="currentColor" stroke="none"/></svg></div>
          <div class="kkt-tab-label" data-i18n="kkt_chats">聊天</div>
          <span class="kkt-nav-badge" id="kktTotalBadge" style="display:none">0</span>
        </div>
        <div class="kkt-tab" id="kktNavMore" onclick="switchKktTab('more')">
          <div class="kkt-tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.2l7.3-4.2v13.4L7.2 14.5H4a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1Z"/><path d="M17.6 8.4a4.6 4.6 0 0 1 0 7.2"/><path d="M20 5.6a8.2 8.2 0 0 1 0 12.8"/></svg></div>
          <div class="kkt-tab-label" data-i18n="kkt_notices">公告</div>
          <span class="kkt-nav-badge" id="kktNoticeBadge">1</span>
        </div>
      </nav>
    </div>

    <!-- 真实对话室 -->
    <div class="kkt-room hidden" id="kktRoom">
      <div class="kkt-room-top">
        <button class="kkt-room-back" onclick="closeKktRoom()">‹</button>
        <div class="kkt-room-title">
          <strong id="kktRoomName">聊天对象</strong></span><span class="kkt-room-sub" id="kktRoomSub"><聊天/span>
        </div>
        <div class="kkt-room-actions">
          <span onclick="triggerBannerNotification('KakaoTalk', '聊天室设置', '已保存历史记录')">☰
        </div>
      </div>

      <div class="kkt-messages-flow" id="kktMsgFlow"></div>

      <div class="kkt-reply-panel" id="kktReplyPanel">
        <div id="kktChoicesBox" class="kkt-choice-grid"></div>
        <div class="kkt-fake-input-bar">
          <span class="kkt-input-plus">＋</span>
          <div class="kkt-input-mock" id="kktInputMock">请点击上方选项进行回复</div>
          <span class="kkt-send-icon">⬆</span>
        </div>
      </div>
    </div>

    <!-- 学校公告详情 / 调查问卷 -->
    <div class="kkt-notice-detail hidden" id="kktNoticeDetail">
      <div class="kkt-room-top notice-topbar">
        <button class="kkt-room-back" onclick="closeNoticeDetail()">‹</button>
        <div class="kkt-room-title"><strong id="kktNoticeTitle">学校公告</strong></div>
        <div class="kkt-room-actions"><span style="width:24px;display:inline-block"></span></div>
      </div>
      <div class="kkt-notice-body" id="kktNoticeBody"></div>
    </div>
  </section>

  <!-- AssistiveTouch 悬浮小白球 -->
  <div class="assistive-touch hidden" id="assistiveTouch">
    <div class="inner-circle"></div>
  </div>

  <!-- 底部 Home 长条手势 -->
  <div class="home-indicator white" id="homeIndicator" onclick="goHome()"></div>

  <!-- 通用编辑输入弹窗 -->
  <div class="edit-modal-mask hidden" id="editModalMask">
    <div class="edit-modal">
      <h3 id="editModalTitle">编辑内容</h3>
      <input type="text" id="editModalInput1" placeholder="标题/时间">
      <textarea id="editModalTextarea" placeholder="正文内容"></textarea>
      <div class="edit-modal-btns">
        <button class="edit-btn cancel" onclick="closeEditModal()">取消</button>
        <button class="edit-btn confirm" id="editModalConfirmBtn">保存</button>
      </div>
    </div>
  </div>

  <!-- 主语言选择 -->
  <div class="lang-mask hidden" id="langMask" onclick="if(event.target===this)closeLanguageSheet()">
    <div class="lang-sheet">
      <div class="lang-head">
        <strong id="langTitle">手机主语言</strong>
        <button id="langCancel" onclick="closeLanguageSheet()">取消</button>
      </div>
      <div id="langOptions"></div>
    </div>
  </div>
</main>
</div>

// 核心：全自动 Canvas 图像压缩
function compressImage(file, maxDimension, quality = 0.76) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width;
        let h = img.height;
        if (w > maxDimension || h > maxDimension) {
          if (w > h) {
            h = Math.round((h * maxDimension) / w);
            w = maxDimension;
          } else {
            w = Math.round((w * maxDimension) / h);
            h = maxDimension;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function safeLocalStorageSet(key, value) {
  try {
    localStorage.setItem(key, value);
    return true;
  } catch(e) {
    console.warn('LocalStorage 写入受限，启动轻量保护:', e);
    return false;
  }
}

function exportCustomData() {

    CONTACTS, ALL_PHOTOS, ALL_NOTES, ALL_SAFARI, APP_ICONS, CHAT_EVENTS, storyState, readState
  };
  const blob = new Blob([JSON.stringify(pack, null, 2)], {type : 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `iPhone_Story_Backup_${Date.now()}.json`;
  a.click();
  triggerBannerNotification('设置', '已导出', '备份配置文件已成功生成');
}

function importCustomData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const parsed = JSON.parse(evt.target.result);
      if (parsed.CONTACTS) CONTACTS = parsed.CONTACTS;
      if (parsed.ALL_PHOTOS) ALL_PHOTOS = parsed.ALL_PHOTOS;
      if (parsed.ALL_NOTES) ALL_NOTES = parsed.ALL_NOTES;
      if (parsed.ALL_SAFARI) ALL_SAFARI = parsed.ALL_SAFARI;
      if (parsed.APP_ICONS) APP_ICONS = parsed.APP_ICONS;
      if (parsed.CHAT_EVENTS) CHAT_EVENTS = parsed.CHAT_EVENTS;
      if (parsed.storyState) storyState = parsed.storyState;
      if (parsed.readState) readState = parsed.readState;
      saveCustomData();
      location.reload();
    } catch(err) {
      alert('导入文件格式异常，无法解析！');
    }
  };
  reader.readAsText(file);
}

function normalizeStoryState(s) {
  if (!s || !s.conversations) return freshStoryState();
  s.currentStageIndex = Number(s.currentStageIndex) || 0;
  s.activeContactId = null;
  if (!s.storyDate) s.storyDate = CHAT_EVENTS[0] ? CHAT_EVENTS[0].date : '3月2日';
  if (typeof s.storyYear !== 'number') s.storyYear = deriveStoryYear(s.currentStageIndex);
  if (!s.sceneTime) s.sceneTime = '17:42';
  if (typeof s.messageSeq !== 'number') s.messageSeq = 0;
  s.isTyping = false;
  ['haerin', 'friend', 'minji', 'group'].forEach(id => {
    if (!s.conversations[id]) s.conversations[id] = { messages: [], unread: 0, lastTime: '', lastOrder: 0 };
    const c = s.conversations[id];
    if (!Array.isArray(c.messages)) c.messages = [];
    if (typeof c.unread !== 'number') c.unread = 0;
    if (typeof c.lastOrder !== 'number') c.lastOrder = 0;
    if (!c.lastTime) c.lastTime = '';
    s.messageSeq = Math.max(s.messageSeq, c.lastOrder);
  });
  return s;
}

function loadStoryState() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    if (data) storyState = normalizeStoryState(JSON.parse(data));
    const rData = localStorage.getItem(READ_STATE_KEY);
    if (rData) {
      const rs = JSON.parse(rData);
      if (rs && typeof rs === 'object') readState = Object.assign({ photosSeenStage: -1, notesSeenStage: -1, safariSeenStage: -1, noticeSeen: false }, rs);
    }
  } catch(e) { console.error(e); }
  applyCustomAppIcons();
  updateAppBadges();
  updateClock();
  renderLockNotifications();
}
function saveStoryState() {
  safeLocalStorageSet(STORAGE_KEY, JSON.stringify(storyState));
  updateAppBadges();
}

  const msg = PHONE_LANG === 'ko'

    : PHONE_LANG === 'hant'
      ? '確認重置劇情？\n目前進度將被清空，並從第一天重新開始。'
      : '确认重置剧情？\n当前进度将被清空，并从第一天重新开始。';
  if (confirm(msg)) {
    clearTimeout(storyStartTimer);
    clearTimeout(storyNextTimer);
    storyRunToken++;
    storyBusy = false;
    storyState = freshStoryState();
    readState = { photosSeenStage: -1, notesSeenStage: -1, safariSeenStage: -1, noticeSeen: !!readState.noticeSeen };
    saveStoryState();
    safeLocalStorageSet(READ_STATE_KEY, JSON.stringify(readState));
    renderKktChatList();
    renderKktFriends();
    if (!$('kktRoom').classList.contains('hidden')) closeKktRoom(true);
    closeNoticeDetail();
    updateAppBadges();
    updateClock();
    renderLockNotifications();
    triggerBannerNotification('系统', t('reset_title'), t('reset_body'));
    storyStartTimer = setTimeout(() => checkAndTriggerNextEvent(), 1200);

/* 锁屏消息通知 */
function renderLockNotifications() {
  const box = $('lockNotifs');
  if (!box) return;
  const items = Object.keys(storyState.conversations).map(id => {
    const c = storyState.conversations[id];
    const person = CONTACTS[id];
    if (!c || !c.messages.length || !c.unread) return null;
    const last = c.messages[c.messages.length - 1];
    return {
      id,
      name: person ? person.name : id,
      avatar: person && person.customAvatar ? `<img src="${person.customAvatar}">` : (person ? person.avatar : '💬'),
      text: (last.sender === '我' ? t('me_prefix') : '') + last.text,
      time: last.time || '',
      count: c.unread,
      order: c.lastOrder || 0
    };
  }).filter(Boolean).sort((a, b) => b.order - a.order).slice(0, 3);

  if (!items.length) { box.innerHTML = ''; box.style.display = 'none'; return; }
  box.style.display = 'flex';
  box.innerHTML = items.map(n => `
    <div class="lock-notif" onclick="event.stopPropagation();openChatFromNotification('${n.id}')">
      <div class="lock-notif-icon">${n.avatar}<span class="lock-notif-count">${n.count}</span></div>
      <div class="lock-notif-body">
        <div class="lock-notif-top"><span class="lock-notif-name">${n.name}</span><span class="lock-notif-time">${n.time}</span></div>
        <div class="lock-notif-text">${escapeHtml(n.text)}</div>
      </div>
    </div>`).join('');
}

$('globalImgPicker').addEventListener('change', async function(e) {
  const file = e.target.files[0];

  try {
    let maxDim = 800;
    if (currentUploadTarget && currentUploadTarget.type === 'contact') maxDim = 250;
    if (currentUploadTarget && currentUploadTarget.type === 'appIcon') maxDim = 180;

    // 智能高质量压缩
    const base64 = await compressImage(file, maxDim, 0.78);

    if (currentUploadTarget && currentUploadTarget.type === 'contact') {
      CONTACTS[currentUploadTarget.id].customAvatar = base64;
      renderKktChatList();
      renderKktFriends();
      if (storyState.activeContactId === currentUploadTarget.id) renderRoomMessages();
      triggerBannerNotification('KakaoTalk', '头像已更换', `${CONTACTS[currentUploadTarget.id].name} 的头像已成功更新`);

      if (currentApp === 'photos') openApp('photos');
      if (!$('photoDetail').classList.contains('hidden')) {
        $('photoArt').innerHTML = `<img src="${base64}">`;
      }
      triggerBannerNotification('照片', '图片已更新', '相片内容已成功自动压缩并替换');
    } else if (currentUploadTarget && currentUploadTarget.type === 'appIcon') {
      APP_ICONS[currentUploadTarget.key] = base64;

      if (currentApp === 'settings') openApp('settings');
      triggerBannerNotification('主屏幕', '图标已更换', '应用桌面图标已成功替换');

  } catch(err) {
    console.error('图片压缩失败', err);

/* 剧情日期 / 时间 */
function parseMonthDay(str) {
  const m = /(\d+)\s*月\s*(\d+)\s*日/.exec(str || '');
  return m ? { month: Number(m[1]), day: Number(m[2]) } : null;
}

function formatStoryDate(str) {
  const md = parseMonthDay(str);
  if (!md) return str || '';
  return PHONE_LANG === 'ko' ? `${md.month}월 ${md.day}일` : `${md.month}月${md.day}日`;
}

function eventYearList() {
  let year = 2024;
  let prevMonth = 0;
  return (CHAT_EVENTS || []).map((e, i) => {
    const md = parseMonthDay(e.date);
    if (!md) return year;
    if (i === 0) { prevMonth = md.month; }
    else if (md.month < prevMonth) { year++; prevMonth = md.month; }
    else { prevMonth = md.month; }
    return year;
  });
}

function deriveStoryYear(stage) {
  const years = eventYearList();
  if (!years.length) return 2024;
  const idx = Math.min(Math.max(stage - 1, 0), years.length - 1);
  return years[idx];
}

function getPhoneDate() {
  const md = parseMonthDay(storyState.storyDate || '');
  if (!md) return new Date();
  return new Date(storyState.storyYear || 2024, md.month - 1, md.day);
}

function updateClock(){
  const d = getPhoneDate();
  const clock = storyState.sceneTime || '17:42';
  $('statusTime').textContent = clock;
  $('lockTime').textContent = clock;

  const full = PHONE_LANG === 'ko'
    ? ['일요일','월요일','화요일','수요일','목요일','금요일','토요일']
    : ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const short = PHONE_LANG === 'ko'
    ? ['일','월','화','수','목','금','토']
    : ['日','一','二','三','四','五','六'];

  $('lockDate').textContent = PHONE_LANG === 'ko'
    ? `${d.getMonth() + 1}월 ${d.getDate()}일 ${full[d.getDay()]}`
    : `${d.getMonth() + 1}月${d.getDate()}日 ${full[d.getDay()]}`;
  $('calWeek').textContent = full[d.getDay()];
  $('calDay').textContent = d.getDate();
  $('calIconDay').textContent = d.getDate();
  $('calIconWeek').textContent = short[d.getDay()];
  $('calMonth').textContent = PHONE_LANG === 'ko' ? `${d.getMonth() + 1}월` : `${d.getMonth() + 1}月`;
  const weekdaysEl = $('calWeekdays');
  if (weekdaysEl) weekdaysEl.innerHTML = short.map(x => `<span>${x}</span>`).join('');

  const first = new Date(d.getFullYear(), d.getMonth(), 1).getDay();
  const total = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
  const storyDays = new Set();
  const yearsForEvents = eventYearList();
  (CHAT_EVENTS || []).forEach((e, i) => {
    const mm = parseMonthDay(e.date);
    if (mm && mm.month === d.getMonth() + 1 && yearsForEvents[i] === d.getFullYear()) storyDays.add(mm.day);
  });
  const arr = [];
  for (let i = 0; i < first; i++) arr.push('<span></span>');
  for (let i = 1; i <= total; i++) {
    arr.push(`<span class="${i === d.getDate() ? 'selected' : ''} ${storyDays.has(i) ? 'has-event' : ''}">${i}</span>`);
  }
  while (arr.length < 42) arr.push('<span></span>');
  $('calDays').innerHTML = arr.join('');
}

function tickStoryClock() {
  if (!storyState.sceneTime) return;
  const parts = storyState.sceneTime.split(':');
  let h = Number(parts[0]), m = Number(parts[1]);
  if (isNaN(h) || isNaN(m)) return;
  m++;
  if (m >= 60) { m = 0; h = (h + 1) % 24; }
  storyState.sceneTime = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  updateClock();
}

updateClock();
setInterval(updateClock, 30000);
setInterval(tickStoryClock, 60000);

/* 故事尚未开始时，进来就是一条新消息 */
function maybeStartStory(delay = 2600) {
  if (!storyState || storyState.currentStageIndex > 0) return;
  const hasMessages = Object.values(storyState.conversations).some(c => c.messages && c.messages.length);
  if (hasMessages || storyState.pendingChoice || storyState.isTyping) return;
  clearTimeout(storyStartTimer);
  storyStartTimer = setTimeout(() => {
    if (storyState.currentStageIndex === 0 && !storyState.pendingChoice && !storyState.isTyping) {
      checkAndTriggerNextEvent();
    }
  }, delay);
}

function onCalendarDateClick(day, month, year) {
  if (!day) return;
  const m = month || (getPhoneDate().getMonth() + 1);
  const y = year || getPhoneDate().getFullYear();
  const years = eventYearList();
  const idx = CHAT_EVENTS.findIndex((e, i) => {
    const md = parseMonthDay(e.date);
    return md && md.month === m && md.day === day && years[i] === y;
  });
  const relatedEvt = idx >= 0 ? CHAT_EVENTS[idx] : null;
  const dateStr = formatStoryDate(`${m}月${day}日`);
  const evtText = relatedEvt ? `${relatedEvt.messages[0].sender}：${relatedEvt.messages[0].text}` : '当天没有记录任何特别的事情。';

  $('detailHeader').textContent = '日历日程';
  $('detailBody').innerHTML = `<h2>${dateStr}</h2><div class="meta">学期日程</div><div>${evtText}</div>`;
  showScreen('detailView');
}

    item.title = t; item.desc = d;

function submitSurvey() {
  const form = $('surveyForm');
  if (!form) return;
  let missing = 0;
  let firstMissing = null;
  form.querySelectorAll('.survey-q[data-required]').forEach(q => {
    q.classList.remove('missing');
    if (!q.querySelector('input[type="radio"]:checked')) {
      missing++;
      q.classList.add('missing');
      if (!firstMissing) firstMissing = q;
    }
  });
  if (missing) {
    const alertEl = $('surveyAlert');
    if (alertEl) {
      alertEl.classList.remove('hidden');
      $('surveyMissingCount').textContent = missing;
      alertEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    triggerBannerNotification('调查问卷', '还有题目未完成', `请完成剩余 ${missing} 道题目后再提交`);
    return;
  }
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const no = 'QN-0924-' + String(Math.floor(1000 + Math.random() * 9000));
  $('kktNoticeTitle').textContent = t('submitted');
  $('kktNoticeBody').innerHTML = `
    <div class="survey-done">
      <div class="survey-done-icon">✓</div>
      <h2>问卷提交成功</h2>
      <p class="done-sub">感谢你的配合。<br>你的回答已匿名提交至学生事务管理处。</p>
      <div class="done-card">
        <div><span>问卷编号</span><b>${no}</b></div>
        <div><span>调查对象</span><b>全体在校学生</b></div>
        <div><span>填写方式</span><b>匿名</b></div>
        <div><span>提交时间</span><b>9月24日 ${pad(now.getHours())}:${pad(now.getMinutes())}</b></div>
      </div>
      <p class="done-note">本问卷不记录个人身份信息。<br>请勿在公共场合讨论其他同学的私人情况。</p>
      <button type="button" class="survey-submit-btn" onclick="closeNoticeDetail()">返回公告</button>
    </div>`;
  $('kktNoticeBody').scrollTop = 0;
  readState.noticeSeen = true;
  safeLocalStorageSet(READ_STATE_KEY, JSON.stringify(readState));
  updateAppBadges();
  triggerBannerNotification('学校公告', '问卷已提交', '感谢你的配合，问卷已匿名提交');
}
