  contactIds.forEach(id => { totalUnread += storyState.conversations[id].unread || 0; });

  const visible = contactIds
    .filter(id => storyState.conversations[id].messages.length > 0)
    .sort((a, b) => (storyState.conversations[b].lastOrder || 0) - (storyState.conversations[a].lastOrder || 0));

  if (!visible.length) {
    container.innerHTML = `<div class="kkt-empty">
      <div class="big">💬</div>
      <div class="t">${t('chat_empty_title')}</div>
      <div class="s">${t('chat_empty_sub')}</div>
    </div>`;
  } else {
    container.innerHTML = '';
    visible.forEach(id => {
      const c = CONTACTS[id];
      const conv = storyState.conversations[id];
      const lastMsg = conv.messages[conv.messages.length - 1];
      const timeLabel = lastMsg && lastMsg.date && lastMsg.date !== storyState.storyDate
        ? formatStoryDate(lastMsg.date)
        : (lastMsg ? lastMsg.time : '');
      const item = document.createElement('div');
      item.className = 'kkt-chat-item';
      item.dataset.chatId = id;
      if (flashContactId === id) {
        item.classList.add('flash');
        flashContactId = null;
      }
      item.innerHTML = `
        <div class="kkt-av-wrap">
          <div class="kkt-avatar ${c.color}">
            ${c.customAvatar ? `<img src="${c.customAvatar}">` : c.avatar}
          </div>
        </div>
        <div class="kkt-chat-info">
          <div class="kkt-name-row">
            <div class="kkt-name">${c.name} <span class="kkt-count">${id === 'group' ? '6' : ''}</span></div>
            <div class="kkt-time">${timeLabel}</div>
          </div>
          <div class="kkt-preview-row">
            <div class="kkt-preview">${escapeHtml(chatListPreview(id, lastMsg))}</div>
            ${conv.unread > 0 ? `<span class="kkt-badge">${conv.unread}</span>` : ''}
          </div>
        </div>`;
      item.onclick = () => openKktRoom(id);
      container.appendChild(item);
    });
  }

  const badgeEl = $('kktTotalBadge');
  if (totalUnread > 0) {
    badgeEl.textContent = totalUnread > 99 ? '99+' : totalUnread;
    badgeEl.style.display = 'grid';
  } else {
    badgeEl.style.display = 'none';
  }
}

function openKktRoom(contactId, instant = false) {
  if (!storyState.conversations[contactId]) return;
  roomToken++;
  closeLanguageSheet();
  storyState.activeContactId = contactId;
  const conv = storyState.conversations[contactId];
  const dividerIndex = conv.messages.findIndex(m => m.unread);
  conv.messages.forEach(m => { m.unread = false; });
  conv.unread = 0;
  saveStoryState();
  renderKktChatList();

  const c = CONTACTS[contactId];
  $('kktRoomName').textContent = c.name + (contactId === 'group' ? ' (6)' : '');
  $('kktRoomSub').textContent = contactId === 'group' ? t('kkt_group_sub') : t('kkt_room_sub');
  const room = $('kktRoom');
  room.classList.remove('hidden', 'push-in', 'push-out');
  if (!instant) {
    void room.offsetWidth;
    room.classList.add('push-in');
    setTimeout(() => room.classList.remove('push-in'), 320);
  }
  renderRoomMessages(dividerIndex);
}

function closeKktRoom(instant = false) {
  const room = $('kktRoom');
  const token = ++roomToken;
  const closingContact = storyState.activeContactId;
  const finish = () => {
    if (token !== roomToken) return;
    room.classList.add('hidden');
    room.classList.remove('push-in', 'push-out');
    if (storyState.activeContactId === closingContact) storyState.activeContactId = null;
    removeTypingBubble();
    renderKktChatList();
    updateAppBadges();
  };
  if (instant) { finish(); return; }
  room.classList.remove('push-in');
  room.classList.add('push-out');
  setTimeout(finish, 240);
}

function msgMinute(time) {
  const p = String(time || '0:0').split(':');
  return (Number(p[0]) || 0) * 60 + (Number(p[1]) || 0);
}

function sameMsgRun(a, b) {
  if (!a || !b) return false;
  if (a.sender !== b.sender || a.date !== b.date) return false;
  return Math.abs(msgMinute(a.time) - msgMinute(b.time)) <= 2;
}

function avatarForMessage(contactId, sender) {
  let person = CONTACTS[contactId];
  if (contactId === 'group') {
    if (sender === '朋友') person = CONTACTS.friend;
    else if (sender === '姜海粼') person = CONTACTS.haerin;
    else if (sender === '金玟池') person = CONTACTS.minji;
    else person = null;
  }
  let color = person ? person.color : 'group';
  let inner = person
    ? (person.customAvatar ? `<img src="${person.customAvatar}">` : person.avatar)
    : (sender || '?').charAt(0);
  if (!person) {
    color = sender === '同学A' ? 'blue' : 'group';
    inner = /^同学/.test(sender || '') ? sender.slice(-1) : (sender || '?').charAt(0);
  }
  return { html: `<div class="kkt-msg-av ${color}">${inner}</div>`, color };
}

function renderRoomMessages(dividerIndex = -1, highlightLast = false) {
  const contactId = storyState.activeContactId;
  if (!contactId) return;

  const conv = storyState.conversations[contactId];
  const flow = $('kktMsgFlow');
  const prevScroll = flow.scrollTop;
  const nearBottom = flow.scrollHeight - prevScroll - flow.clientHeight < 100;
  flow.innerHTML = '';

  if (!conv.messages.length && !storyState.isTyping) {
    const person = CONTACTS[contactId];
    flow.innerHTML = `<div class="kkt-empty">
      <div class="big">💬</div>
      <div class="t">${person ? person.name : ''}</div>
      <div class="s">${t('chat_empty_sub')}</div>
    </div>`;
    renderChoicesPanel();
    return;
  }

  let lastDatePill = '';
  conv.messages.forEach((m, idx) => {
    if (m.date && m.date !== lastDatePill) {
      const pill = document.createElement('div');
      pill.className = 'kkt-date-pill';
      pill.textContent = formatStoryDate(m.date);
      flow.appendChild(pill);
      lastDatePill = m.date;
    }
    if (idx === dividerIndex) {
      const divider = document.createElement('div');
      divider.className = 'kkt-new-divider';
      divider.textContent = PHONE_LANG === 'ko' ? '새 메시지' : (PHONE_LANG === 'hant' ? '以下為新訊息' : '以下为新消息');
      flow.appendChild(divider);
    }

    const isMe = (m.sender === '我');
    const first = !sameMsgRun(conv.messages[idx - 1], m);
    const last = !sameMsgRun(m, conv.messages[idx + 1]);
    const row = document.createElement('div');
    row.className = `kkt-msg-row ${isMe ? 'me' : 'them'}${first ? ' first' : ''}${last ? ' last' : ''}${(highlightLast && idx === conv.messages.length - 1) ? ' arrive' : ''}`;

    const avatar = isMe ? null : avatarForMessage(contactId, m.sender);
    const avatarHtml = avatar ? avatar.html : '';
    const senderHtml = (!isMe && contactId === 'group' && first)
      ? `<span class="kkt-msg-sender">${escapeHtml(m.sender)}</span>`
      : '';

    row.innerHTML = `
      ${avatarHtml}
      <div class="kkt-msg-content">
        ${senderHtml}
        <div class="kkt-bubble-wrap">
          <div class="kkt-bubble">${escapeHtml(m.text)}</div>
          <span class="kkt-msg-time">${m.time || ''}</span>
        </div>
      </div>
    `;
    flow.appendChild(row);
  });

  if (storyState.isTyping) renderTypingBubble();
  renderChoicesPanel();

  if (nearBottom) scrollRoomToBottom();
  else setTimeout(() => { flow.scrollTop = prevScroll; }, 0);
}

function onBubbleDblClick(msgIndex) {
  if (!isEditMode) return;
  const contactId = storyState.activeContactId;
  const msg = storyState.conversations[contactId].messages[msgIndex];
  openEditModal('编辑此条聊天消息', msg.sender, msg.text, (s, t) => {
    msg.text = t;
    saveCustomData();
    renderRoomMessages();
  });
}

function escapeHtml(str) {
  return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderTypingBubble() {
  const flow = $('kktMsgFlow');
  removeTypingBubble();
  const contactId = storyState.activeContactId;
  const person = CONTACTS[contactId];
  const avatar = person
    ? `<div class="kkt-msg-av ${person.color}">${person.customAvatar ? `<img src="${person.customAvatar}">` : person.avatar}</div>`
    : `<div class="kkt-msg-av group">…</div>`;
  const typingDiv = document.createElement('div');
  typingDiv.id = 'kktTypingEl';
  typingDiv.className = 'kkt-msg-row them first last';
  typingDiv.innerHTML = `
    ${avatar}
    <div class="kkt-msg-content">
      <div class="kkt-typing">
        <div class="kkt-typing-dot"></div>
        <div class="kkt-typing-dot"></div>
        <div class="kkt-typing-dot"></div>
      </div>
    </div>
  `;
  flow.appendChild(typingDiv);
  scrollRoomToBottom();
}

function removeTypingBubble() {
  const el = document.getElementById('kktTypingEl');
  if (el) el.remove();
}

function scrollRoomToBottom() {
  const flow = $('kktMsgFlow');
  setTimeout(() => { flow.scrollTop = flow.scrollHeight; }, 40);
}

function renderChoicesPanel() {
  const box = $('kktChoicesBox');
  box.innerHTML = '';
  const inputMock = $('kktInputMock');

  if (storyState.pendingChoice && storyState.pendingChoice.contactId === storyState.activeContactId) {
    inputMock.textContent = t('choose_hint');
    const label = document.createElement('div');
    label.className = 'kkt-choice-label';
    label.textContent = t('choice_label');
    box.appendChild(label);
    const group = storyState.pendingChoice.choiceGroup;
    group.choices.forEach(ch => {
      const btn = document.createElement('button');
      btn.className = 'kkt-choice-btn';
      btn.textContent = ch.text;
      btn.onclick = () => handlePlayerChoice(ch);
      box.appendChild(btn);
    });
    setTimeout(scrollRoomToBottom, 60);
  } else {
    inputMock.textContent = t('waiting');
  }
}

/* =========================================================
   9. 剧情推进控制器
   ========================================================= */
function checkAndTriggerNextEvent() {
  if (storyBusy || storyState.pendingChoice || storyState.isTyping) return;
  if (storyState.currentStageIndex >= CHAT_EVENTS.length) return;
  triggerEvent(CHAT_EVENTS[storyState.currentStageIndex]);
}

function nextSceneTime() {
  const parts = String(storyState.sceneTime || '17:42').split(':');
  let h = Number(parts[0]) || 0;
  let m = Number(parts[1]) || 0;
  m++;
  if (m >= 60) { m = 0; h = (h + 1) % 24; }
  storyState.sceneTime = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
  return storyState.sceneTime;
}

function deliverIncoming(contactId, evt, item, runToken) {
  if (runToken !== storyRunToken) return;
  const conv = storyState.conversations[contactId];
  const isActive = storyState.activeContactId === contactId;
  const timeStr = item.time || storyState.sceneTime || '17:42';
  conv.messages.push({
    sender: item.sender,
    text: item.text,
    date: evt.date,
    time: timeStr,
    unread: !isActive
  });
  conv.lastTime = timeStr;
  conv.lastOrder = ++storyState.messageSeq;
  storyState.sceneTime = timeStr;

  if (isActive) {
    conv.unread = 0;
  } else {
    conv.unread = (conv.unread || 0) + 1;
    flashContactId = contactId;
    triggerBannerNotification('KakaoTalk', CONTACTS[contactId].name, item.text, () => openChatFromNotification(contactId));
  }

  saveStoryState();
  updateClock();
  renderKktChatList();
  if (storyState.activeContactId === contactId) renderRoomMessages(-1, true);
}

function triggerEvent(evt) {
  if (!evt || storyBusy || storyState.pendingChoice) return;
  storyBusy = true;
  const runToken = storyRunToken;
  const contactId = evt.contactId;
  const messages = [...evt.messages];
  const dateChanged = storyState.storyDate !== evt.date;
  const prevMd = parseMonthDay(storyState.storyDate);
  const nextMd = parseMonthDay(evt.date);
  if (prevMd && nextMd && nextMd.month < prevMd.month) {
    storyState.storyYear = (storyState.storyYear || 2024) + 1;
  }
  storyState.storyDate = evt.date;
  if (dateChanged && messages[0] && messages[0].time) storyState.sceneTime = messages[0].time;
  storyState.isTyping = false;
  updateClock();
  saveStoryState();

  function playNextMsg() {
    if (runToken !== storyRunToken) { storyBusy = false; return; }
    if (messages.length === 0) {
      if (evt.choiceGroup) {
        storyState.pendingChoice = { contactId, choiceGroup: evt.choiceGroup };
        storyBusy = false;
        storyState.isTyping = false;
        saveStoryState();
        renderKktChatList();
        if (storyState.activeContactId === contactId) renderChoicesPanel();
      } else {
        storyState.currentStageIndex++;
        storyBusy = false;
        storyState.isTyping = false;
        saveStoryState();
        clearTimeout(storyNextTimer);
        storyNextTimer = setTimeout(() => {
          if (runToken === storyRunToken) checkAndTriggerNextEvent();
        }, 4200);
      }
      return;
    }

    const item = messages.shift();
    storyState.isTyping = true;
    if (storyState.activeContactId === contactId) renderTypingBubble();
    const typingDelay = Math.min(2500, 520 + Math.max(item.text.length, 3) * 42);

    setTimeout(() => {
      if (runToken !== storyRunToken) { storyBusy = false; return; }
      storyState.isTyping = false;
      removeTypingBubble();
      deliverIncoming(contactId, evt, item, runToken);
      setTimeout(playNextMsg, 620 + Math.random() * 420);
    }, typingDelay);
  }

  playNextMsg();
}

function handlePlayerChoice(selectedChoice) {
  const contactId = storyState.activeContactId;
  if (!contactId || !storyState.pendingChoice || storyState.pendingChoice.contactId !== contactId) return;
  storyBusy = true;
  const runToken = storyRunToken;
  const conv = storyState.conversations[contactId];
  const timeStr = nextSceneTime();

  conv.messages.push({
    sender: '我',
    text: selectedChoice.text,
    date: storyState.storyDate,
    time: timeStr,
    unread: false
  });
  conv.lastOrder = ++storyState.messageSeq;
  conv.lastTime = timeStr;
  storyState.pendingChoice = null;
  saveStoryState();
  updateClock();
  renderRoomMessages(-1, true);
  renderKktChatList();

  const replyList = selectedChoice.replyBranch ? [...selectedChoice.replyBranch] : [];

  function playBranchReplies() {
    if (runToken !== storyRunToken) { storyBusy = false; return; }
    if (replyList.length === 0) {
      if (selectedChoice.subChoice) {
        storyState.pendingChoice = { contactId, choiceGroup: selectedChoice.subChoice };
        storyBusy = false;
        storyState.isTyping = false;
        saveStoryState();
        if (storyState.activeContactId === contactId) renderChoicesPanel();
      } else {
        storyState.currentStageIndex++;
        storyBusy = false;
        storyState.isTyping = false;
        saveStoryState();
        clearTimeout(storyNextTimer);
        storyNextTimer = setTimeout(() => {
          if (runToken === storyRunToken) checkAndTriggerNextEvent();
        }, 3800);
      }
      return;
    }

    const nextMsg = replyList.shift();
    storyState.isTyping = true;
    if (storyState.activeContactId === contactId) renderTypingBubble();
    const typingDelay = Math.min(2400, 520 + Math.max(nextMsg.text.length, 3) * 40);

    setTimeout(() => {
      if (runToken !== storyRunToken) { storyBusy = false; return; }
      storyState.isTyping = false;
      removeTypingBubble();
      const msgTime = nextMsg.time || nextSceneTime();
      conv.messages.push({
        sender: nextMsg.sender,
        text: nextMsg.text,
        date: storyState.storyDate,
        time: msgTime,
        unread: storyState.activeContactId !== contactId
      });
      conv.lastOrder = ++storyState.messageSeq;
      conv.lastTime = msgTime;
      storyState.sceneTime = msgTime;

      const active = storyState.activeContactId === contactId;
      if (!active) {
        conv.unread = (conv.unread || 0) + 1;
        flashContactId = contactId;
        triggerBannerNotification('KakaoTalk', CONTACTS[contactId].name, nextMsg.text, () => openChatFromNotification(contactId));
      }
      saveStoryState();
      updateClock();
      renderKktChatList();
      if (active) renderRoomMessages(-1, true);
      setTimeout(playBranchReplies, 680);
    }, typingDelay);
  }

  setTimeout(playBranchReplies, 450);
}

/* =========================================================
   10. AssistiveTouch 悬浮小白球与手势
   ========================================================= */
const ball = $('assistiveTouch');
const phoneEl = $('phone');
let isDragging = false, dragMoved = false;
let startPointerX, startPointerY, initialLeft, initialTop;

function initBallPos(){
  const rect = phoneEl.getBoundingClientRect();
  ball.style.left = (rect.width - 66) + 'px';
  ball.style.top = (rect.height - 180) + 'px';
}
window.addEventListener('load', initBallPos);
window.addEventListener('resize', initBallPos);

function onPointerDown(e) {
  isDragging = true;
  dragMoved = false;
  ball.classList.add('dragging');
  ball.style.transition = 'none';
  const evt = e.touches ? e.touches[0] : e;
  startPointerX = evt.clientX;
  startPointerY = evt.clientY;
  initialLeft = ball.offsetLeft;
  initialTop = ball.offsetTop;
  document.addEventListener('pointermove', onPointerMove);
  document.addEventListener('pointerup', onPointerUp);
  document.addEventListener('touchmove', onPointerMove, {passive:false});
  document.addEventListener('touchend', onPointerUp);
}
function onPointerMove(e) {
  if (!isDragging) return;
  const evt = e.touches ? e.touches[0] : e;
  const dx = evt.clientX - startPointerX;
  const dy = evt.clientY - startPointerY;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4) dragMoved = true;
  const rect = phoneEl.getBoundingClientRect();
  let nx = Math.max(8, Math.min(rect.width - ball.offsetWidth - 8, initialLeft + dx));
  let ny = Math.max(48, Math.min(rect.height - ball.offsetHeight - 48, initialTop + dy));
  ball.style.left = nx + 'px';
  ball.style.top = ny + 'px';
  if(e.cancelable) e.preventDefault();
}
function onPointerUp() {
  if (!isDragging) return;
  isDragging = false;
  ball.classList.remove('dragging');
  document.removeEventListener('pointermove', onPointerMove);
  document.removeEventListener('pointerup', onPointerUp);
  document.removeEventListener('touchmove', onPointerMove);
  document.removeEventListener('touchend', onPointerUp);
  const rect = phoneEl.getBoundingClientRect();
  ball.style.transition = 'left 0.3s cubic-bezier(0.2, 0.9, 0.3, 1), top 0.3s ease, opacity 0.3s ease';
  if (ball.offsetLeft + ball.offsetWidth / 2 < rect.width / 2) {
    ball.style.left = '10px';
  } else {
    ball.style.left = (rect.width - ball.offsetWidth - 10) + 'px';
  }
  if (!dragMoved) goHome();
}
ball.addEventListener('pointerdown', onPointerDown);
ball.addEventListener('touchstart', onPointerDown, {passive:false});

// 锁屏轻按/上滑解锁
$('lockScreen').addEventListener('click', unlock);
let startY = null;
$('phone').addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, {passive: true});
$('phone').addEventListener('touchend', e => {
  if (currentApp === 'lock' && startY !== null && startY - e.changedTouches[0].clientY > 45) {
    unlock();
  }
  startY = null;
}, {passive: true});

// 初始化数据：图片沿用内置存档，剧情从第一天开始
initDefaults();
loadStoryState();
applyLanguage();
maybeStartStory(2400);
</script>
